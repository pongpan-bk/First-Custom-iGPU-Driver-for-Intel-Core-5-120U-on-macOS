name: Build MyIntelGPU Thin Bridge

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEXT_NAME: MyIntelGPU
  MAX_BINARY_BYTES: "180000"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Thin Bridge Kext (x86_64)
    runs-on: macos-15-intel

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare MacKernelSDK
      run: |
        set -euo pipefail
        git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git "$GITHUB_WORKSPACE/MacKernelSDK"
        XCODE_SDK="$(xcrun --show-sdk-path)"
        if [ -d "$XCODE_SDK/System/Library/Frameworks/Kernel.framework/Headers" ]; then
          rsync -a --ignore-existing "$XCODE_SDK/System/Library/Frameworks/Kernel.framework/Headers/" "$GITHUB_WORKSPACE/MacKernelSDK/Headers/"
        fi
        test -f "$GITHUB_WORKSPACE/MacKernelSDK/Library/x86_64/libkmod.a"

    - name: Lint Info.plist and normalize LF
      run: |
        set -euo pipefail
        plutil -lint Info.plist
        if [ -f exported_symbols.txt ]; then
          tr -d '\r' < exported_symbols.txt > exported_symbols.tmp && mv exported_symbols.tmp exported_symbols.txt
        fi

    - name: Build Thin Bridge Kext
      run: |
        set -euo pipefail
        rm -rf "$KEXT_NAME.kext" build/thin-kext ./*.o
        make KERNEL_SDK_DIR="$GITHUB_WORKSPACE/MacKernelSDK" -j4

    - name: Verify Kext ABI and OpenCore readiness
      run: |
        set -euo pipefail
        BIN="${KEXT_NAME}.kext/Contents/MacOS/${KEXT_NAME}"
        file "$BIN" | grep -q "x86_64"
        ! otool -l "$BIN" | grep -q "LC_DYLD_CHAINED_FIXUPS"
        nm -u "$BIN" > /tmp/undef.txt || true
        ! grep -Eq '__stack_chk_guard|___strlcpy_chk' /tmp/undef.txt
        SIZE=$(stat -f%z "$BIN")
        echo "Thin Kext binary size: ${SIZE} bytes"
        test "$SIZE" -le "$MAX_BINARY_BYTES"

    - name: Package and Upload Artifact
      run: |
        ditto -c -k --sequesterRsrc --keepParent "${KEXT_NAME}.kext" "${KEXT_NAME}-thin-kext.zip"

    - name: Upload Kext ZIP
      uses: actions/upload-artifact@v4
      with:
        name: MyIntelGPU-thin-kext
        path: MyIntelGPU-thin-kext.zip
        retention-days: 14
