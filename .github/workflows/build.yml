name: Build MyIntelGPU.kext

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — build number = real commit count

      - name: Fetch MacKernelSDK
        run: git clone --depth 1 https://github.com/acidanthera/MacKernelSDK.git "$HOME/MacKernelSDK"

      - name: Build
        run: make

      - name: Size gate (128KB warn)
        run: make sizecheck

      - name: Read stamped version
        id: ver
        run: |
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' MyIntelGPU.kext/Contents/Info.plist)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload kext artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyIntelGPU-kext-${{ steps.ver.outputs.version }}
          path: MyIntelGPU.kext/
          if-no-files-found: error

      - name: Build installer pkg
        run: make pkg

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyIntelGPU-pkg-${{ steps.ver.outputs.version }}
          path: "MyIntelGPU-*.pkg"
          if-no-files-found: error
